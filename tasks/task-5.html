<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Задача 5</title>
	</head>
	<body>
		<h1>Задача 5</h1>
		<p>Дано кількість секунд, що пройшла від початку доби.Визначити скільки це годин і хвилин.</p>
		<script>
			const numberOfSeconds = parseInt(prompt("Введіть кількість секунд, що пройшли від початку доби, с"))
			const secondOfHour = 3600;
			const secondOfMinute = 60;


			const hours = Math.floor(numberOfSeconds / secondOfHour)
			const seconds = numberOfSeconds % secondOfHour;
			const minutes = Math.floor(seconds / secondOfMinute);

			document.writeln(`Минуло ${hours} годин і ${minutes} хвилин`);
	</script>
	</body>
</html>
