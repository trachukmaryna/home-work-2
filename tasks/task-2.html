<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Задача 2</title>
	</head>
	<body>
		<h1>Задача 2</h1>
		<p>Дано рік народження (дата: 1 січня) та поточний рік. Знайти кількість років.</p>
		<script>
			const yourYear = parseInt(prompt('Введіть Ваш рік народження', 1989));
			const currentYear = new Date().getFullYear();

			const numberOfYears = currentYear - yourYear;

			document.write(`Вам ${numberOfYears} років`);
	</script>
	</body>
</html>
